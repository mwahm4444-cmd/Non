<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة إلى عالم الزهور</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #1a001a 0%, #000000 100%);
            overflow: hidden;
            font-family: 'Tahoma', sans-serif;
            perspective: 1000px;
        }

        /* الفضاء والنجوم المتطايرة */
        .space-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.2; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.4); }
        }

        /* حاوية الرحلة والانتقال السينمائي (زووم إن وتغلغل) */
        .scene-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
            animation: cinematicDive 6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* كوكب الزهرة الضخم المليء بالتفاصيل في البداية */
        .planet-rose {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
            animation: rotatePlanet 15s infinite linear;
        }

        @keyframes rotatePlanet {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* أوراق الكوكب/الزهرة المتعددة */
        .petal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 150px;
            background: linear-gradient(to top, #4a001a, #cc0044, #ff1a75, #ff99cc);
            border-radius: 50% 50% 40% 40%;
            transform-origin: center bottom;
            box-shadow: 0 0 15px rgba(255, 20, 117, 0.6);
            border: 1px solid rgba(255, 192, 203, 0.3);
        }

        /* توزيع الأوراق بشكل دقيق وغني */
        .petal:nth-child(1)  { transform: translate(-50%, -100%) rotate(0deg); }
        .petal:nth-child(2)  { transform: translate(-50%, -100%) rotate(30deg); }
        .petal:nth-child(3)  { transform: translate(-50%, -100%) rotate(60deg); }
        .petal:nth-child(4)  { transform: translate(-50%, -100%) rotate(90deg); }
        .petal:nth-child(5)  { transform: translate(-50%, -100%) rotate(120deg); }
        .petal:nth-child(6)  { transform: translate(-50%, -100%) rotate(150deg); }
        .petal:nth-child(7)  { transform: translate(-50%, -100%) rotate(180deg); }
        .petal:nth-child(8)  { transform: translate(-50%, -100%) rotate(210deg); }
        .petal:nth-child(9)  { transform: translate(-50%, -100%) rotate(240deg); }
        .petal:nth-child(10) { transform: translate(-50%, -100%) rotate(270deg); }
        .petal:nth-child(11) { transform: translate(-50%, -100%) rotate(300deg); }
        .petal:nth-child(12) { transform: translate(-50%, -100%) rotate(330deg); }

        /* قلب الكوكب */
        .planet-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #ff3366, #66001a);
            border-radius: 50%;
            box-shadow: 0 0 30px #ff0055;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            animation: pulseCore 1.5s infinite ease-in-out;
        }

        @keyframes pulseCore {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        /* تأثير الغوص والدخول (Zoom in عميق يملأ الشاشة) */
        @keyframes cinematicDive {
            0% { transform: translate(-50%, -50%) scale(0.1) translateZ(-1000px); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(8) translateZ(500px); opacity: 1; }
        }

        /* الرسالة وعالم الزهور الأرضي الذي يظهر بعد الدخول */
        .ground-world {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
            animation: showGroundWorld 2s ease 5s forwards;
            z-index: 100;
            padding: 0 20px;
        }

        .ground-world h1 {
            color: #ff99cc;
            font-size: 26px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 153, 204, 0.8);
        }

        .ground-world p {
            color: #ffe6f2;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        @keyframes showGroundWorld {
            to { opacity: 1; transform: translateY(0); }
        }

        /* قلوب متطايرة رقيقة تزيد من جمال المشهد */
        .floating-heart {
            position: absolute;
            color: #ff4d88;
            font-size: 16px;
            animation: floatUp 4s infinite linear;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- الفضاء والنجوم -->
    <div class="space-container" id="spaceField"></div>

    <!-- مشهد الكوكب والزهرة مع حركة الغوص السينمائي -->
    <div class="scene-wrapper">
        <div class="planet-rose">
            <div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="planet-core">❤️</div>
        </div>
    </div>

    <!-- الرسالة وعالم الزهور النهائي -->
    <div class="ground-world">
        <h1>إلى أبهى وأغلى زهرة في عُمري ❤️</h1>
        <p>هبطنا من أعالي الفضاء، لنستقر في أعمق نقطة من قلبي وروحي.<br>كل عام وأنتِ النبض الذي يزهر أيامي دائماً. 💖</p>
    </div>

    <script>
        // توليد نجوم الفضاء
        const spaceField = document.getElementById('spaceField');
        for (let i = 0; i < 80; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.width = (Math.random() * 3 + 1) + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = (Math.random() * 3) + 's';
            spaceField.appendChild(star);
        }

        // توليد قلوب متطايرة باستمرار
        setInterval(() => {
            let heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }, 500);
    </script>
</body>
</html>
