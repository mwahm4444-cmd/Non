<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة إلى قلب الزهرة</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020005;
            overflow: hidden;
            font-family: 'Tahoma', sans-serif;
        }
        #c {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* الرسالة التي تظهر بعد الغوص */
        .message-box {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            color: #ffe6f2;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in-out;
            z-index: 100;
            text-shadow: 0 0 15px #ff99cc, 0 0 10px #99004c;
        }
        .message-box h1 { font-size: 32px; margin-bottom: 10px; }
        .message-box p { font-size: 18px; line-height: 1.5; }
        .show-message {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <!-- الرسالة الرومانسية تظهر عند الوصول -->
    <div class="message-box" id="loveMessage">
        <h1>إلى أغلى وأبقى كائن في عُمري ❤️</h1>
        <p>مثلما دخلنا إلى قلب هذه الزهرة المليئة بالنجوم، دخلتِ أنتِ إلى أعماق قلبي وروحي.<br>كل عام وأنتِ نوري الذي لا ينطفئ. 💖</p>
    </div>

    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.153.0/three.min.js"></script>

    <script>
        const canvas = document.querySelector('#c');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const scene = new THREE.Scene();

        // 1. خلفية الفضاء والنجوم
        const starsGeometry = new THREE.BufferGeometry();
        const starVertices = [];
        for (let i = 0; i < 10000; i++) {
            const x = THREE.MathUtils.randFloatSpread(2000);
            const y = THREE.MathUtils.randFloatSpread(2000);
            const z = THREE.MathUtils.randFloatSpread(2000);
            starVertices.push(x, y, z);
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xFFFFFF, size: 1.2, sizeAttenuation: true });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // 2. كوكب الزهرة (زهرة ثلاثية الأبعاد معقدة)
        const planetGroup = new THREE.Group();
        scene.add(planetGroup);

        // طبقة الأوراق الخارجية (إضافة تفاصيل)
        const petalGeometry = new THREE.ConeGeometry(30, 100, 32, 3, true);
        const petalMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xFF1493,
            emissive: 0x99004c,
            emissiveIntensity: 0.5,
            side: THREE.DoubleSide,
            flatShading: true,
            roughness: 0.2,
            metalness: 0.3,
        });

        const numPetals = 36;
        const planetRadius = 150;
        for (let i = 0; i < numPetals; i++) {
            const petal = new THREE.Mesh(petalGeometry, petalMaterial);
            petal.position.x = planetRadius * Math.sin((i / numPetals) * Math.PI * 2);
            petal.position.z = planetRadius * Math.cos((i / numPetals) * Math.PI * 2);
            petal.rotation.y = (i / numPetals) * Math.PI * 2 + Math.PI / 2;
            petal.rotation.x = Math.PI / 3; // زاوية ميلان الورقة
            planetGroup.add(petal);
        }

        // الطبقة الداخلية (لتعطي إحساس العمق)
        const innerPetalGeometry = new THREE.ConeGeometry(20, 70, 32, 3, true);
        const innerPetalMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xFF80BF,
            emissive: 0xFF3385,
            side: THREE.DoubleSide,
            flatShading: true,
            roughness: 0.3,
        });
        const numInnerPetals = 24;
        const innerPlanetRadius = 80;
        for (let i = 0; i < numInnerPetals; i++) {
            const innerPetal = new THREE.Mesh(innerPetalGeometry, innerPetalMaterial);
            innerPetal.position.x = innerPlanetRadius * Math.sin((i / numInnerPetals) * Math.PI * 2);
            innerPetal.position.z = innerPlanetRadius * Math.cos((i / numInnerPetals) * Math.PI * 2);
            innerPetal.rotation.y = (i / numInnerPetals) * Math.PI * 2 + Math.PI / 2;
            innerPetal.rotation.x = Math.PI / 4;
            planetGroup.add(innerPetal);
        }

        // قلب الزهرة المضيء
        const coreGeometry = new THREE.IcosahedronGeometry(50, 5);
        const coreMaterial = new THREE.MeshStandardMaterial({
            color: 0xFF4d4d,
            emissive: 0xFF0000,
            emissiveIntensity: 1.5,
            roughness: 0.1,
            metalness: 0.6,
        });
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        planetGroup.add(core);

        // 3. حركة الكاميرا (الغوص)
        camera.position.set(0, 50, 1500);
        let cameraTargetZ = -300; // نقطة الوصول داخل الزهرة
        let isDiving = true;

        // تدوير النجوم وكوكب الزهرة
        function animate() {
            requestAnimationFrame(animate);

            if (isDiving) {
                camera.position.z -= 5;
                if (camera.position.z <= cameraTargetZ) {
                    isDiving = false;
                    // إظهار الرسالة عند الوصول
                    document.getElementById('loveMessage').classList.add('show-message');
                }
            }
            
            // حركات دورانية للنجوم والزهرة لإعطاء حيوية
            starField.rotation.y += 0.0002;
            planetGroup.rotation.y += 0.005;
            planetGroup.rotation.x += 0.002;
            core.rotation.x += 0.01;
            core.rotation.y += 0.01;
            
            renderer.render(scene, camera);
        }

        animate();

        // ضبط حجم الشاشة عند تغيير النافذة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
