<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أغلى الناس</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1a001a, #4a0e2e, #2d0c24);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Tahoma', sans-serif;
            position: relative;
        }

        /* خلفية النجوم المتلألئة */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* حاوية الوردة */
        .flower-scene {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flower {
            position: relative;
            width: 100px;
            height: 100px;
            animation: floatFlower 4s ease-in-out infinite alternate;
        }

        @keyframes floatFlower {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(3deg); }
        }

        /* بتلات الوردة الفاخرة */
        .petal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70px;
            height: 110px;
            background: linear-gradient(to top, #ff1493, #ff69b4, #ffb6c1);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform-origin: center bottom;
            opacity: 0;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.4), 0 0 10px rgba(255, 20, 147, 0.5);
            animation: bloom 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* توجيه وتوقيت كل بتلة لتتفتح بسلاسة */
        .petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg) scale(0); animation-delay: 0.3s; }
        .petal:nth-child(2) { transform: translate(-50%, -100%) rotate(51.4deg) scale(0); animation-delay: 0.5s; }
        .petal:nth-child(3) { transform: translate(-50%, -100%) rotate(102.8deg) scale(0); animation-delay: 0.7s; }
        .petal:nth-child(4) { transform: translate(-50%, -100%) rotate(154.2deg) scale(0); animation-delay: 0.9s; }
        .petal:nth-child(5) { transform: translate(-50%, -100%) rotate(205.6deg) scale(0); animation-delay: 1.1s; }
        .petal:nth-child(6) { transform: translate(-50%, -100%) rotate(257deg) scale(0); animation-delay: 1.3s; }
        .petal:nth-child(7) { transform: translate(-50%, -100%) rotate(308.4deg) scale(0); animation-delay: 1.5s; }

        @keyframes bloom {
            0% {
                opacity: 0;
                transform: translate(-50%, -100%) rotate(var(--rot)) scale(0);
            }
            60% {
                opacity: 0.8;
            }
            100% {
                opacity: 0.95;
                transform: translate(-50%, -100%) rotate(var(--rot)) scale(1);
            }
        }

        /* قلب المركز النابض */
        .center-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #ff4d4d, #990000);
            border-radius: 50%;
            z-index: 20;
            box-shadow: 0 0 20px #ff1493;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: corePop 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2s forwards, heartbeat 1.5s infinite ease-in-out 3.5s;
        }

        .center-core::after {
            content: '❤️';
            font-size: 22px;
        }

        @keyframes corePop {
            to { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes heartbeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
        }

        /* الرسالة العاطفية الراقية */
        .message-box {
            margin-top: 40px;
            text-align: center;
            padding: 0 20px;
            opacity: 0;
            animation: fadeInText 2s ease-in-out 3s forwards;
            z-index: 30;
        }

        .message-box h1 {
            color: #ff99cc;
            font-size: 26px;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(255, 153, 204, 0.5);
        }

        .message-box p {
            color: #ffe6f2;
            font-size: 18px;
            line-height: 1.6;
            margin: 0;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* قلوب متطايرة في الخلفية */
        .floating-heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.6);
            font-size: 16px;
            animation: flyUp 4s infinite linear;
            bottom: 0;
            z-index: 1;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- خلفية نجوم متلألئة -->
    <script>
        for (let i = 0; i < 30; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.width = (Math.random() * 3 + 1) + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = (Math.random() * 3) + 's';
            document.body.appendChild(star);
        }

        // توليد قلوب متطايرة عشوائية
        setInterval(() => {
            let heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }, 600);
    </script>

    <!-- مشهد الوردة المتفتحة -->
    <div class="flower-scene">
        <div class="flower">
            <div class="petal" style="--rot: 0deg;"></div>
            <div class="petal" style="--rot: 51.4deg;"></div>
            <div class="petal" style="--rot: 102.8deg;"></div>
            <div class="petal" style="--rot: 154.2deg;"></div>
            <div class="petal" style="--rot: 205.6deg;"></div>
            <div class="petal" style="--rot: 257deg;"></div>
            <div class="petal" style="--rot: 308.4deg;"></div>
            <div class="center-core"></div>
        </div>
    </div>

    <!-- النصوص الإبداعية والمشاعر الدافئة -->
    <div class="message-box">
        <h1>إلى أينع زهرة في عُمري ❤️</h1>
        <p>مثلما تتفتح هذه الوردة بجمالها ورقتها، تفتح قلبي بحبك وأشرقت أيامي بقربك.<br>كل نبضة في قلبي تنبض باسمك، وكل عام وأنتِ فرحة روحي.</p>
    </div>

</body>
</html>
