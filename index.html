<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أغلى الناس</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #05020a;
            overflow: hidden;
            font-family: 'Tahoma', sans-serif;
            perspective: 1000px;
        }

        /* الفضاء والنجوم المتحركة للعمق */
        .space {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: zoomInSpace 6s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: starGlow 2s infinite alternate;
        }

        @keyframes starGlow {
            from { opacity: 0.3; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.3); }
        }

        /* مشهد الوردة العميق ثلاثي الأبعاد */
 طبقة التمركز الغامر */
        .flower-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%) scale(0.2) rotateX(20deg);
            transform-style: preserve-3d;
            animation: diveIntoFlower 6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* طبقات البتلات لتعطي تأثير الدخول إلى جوف الوردة */
        .rose-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .3d-petal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 180px;
            background: linear-gradient(to top, #8b0032, #ff1493, #ff77a9);
            border-radius: 50% 50% 40% 40%;
            transform-origin: center bottom;
            box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 20, 147, 0.4);
            opacity: 0.95;
            border: 1px solid rgba(255, 182, 193, 0.3);
        }

        /* توزيع البتلات بشكل دائري متداخل لعمق مذهل */
        .3d-petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg) rotateX(15deg); }
        .3d-petal:nth-child(2) { transform: translate(-50%, -100%) rotate(45deg) rotateX(15deg); }
        .3d-petal:nth-child(3) { transform: translate(-50%, -100%) rotate(90deg) rotateX(15deg); }
        .3d-petal:nth-child(4) { transform: translate(-50%, -100%) rotate(135deg) rotateX(15deg); }
        .3d-petal:nth-child(5) { transform: translate(-50%, -100%) rotate(180deg) rotateX(15deg); }
        .3d-petal:nth-child(6) { transform: translate(-50%, -100%) rotate(225deg) rotateX(15deg); }
        .3d-petal:nth-child(7) { transform: translate(-50%, -100%) rotate(270deg) rotateX(15deg); }
        .3d-petal:nth-child(8) { transform: translate(-50%, -100%) rotate(315deg) rotateX(15deg); }

        /* قلب الوردة المضيء في المنتصف */
        .rose-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(30px);
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #ff4d4d, #550011);
            border-radius: 50%;
            box-shadow: 0 0 30px #ff1493, inset 0 0 15px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: corePulse 2s infinite ease-in-out;
        }

        .rose-core span {
            font-size: 30px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes corePulse {
            0%, 100% { transform: translate(-50%, -50%) translateZ(30px) scale(1); }
            50% { transform: translate(-50%, -50%) translateZ(40px) scale(1.1); }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* حركات السفر والدخول للعمق (Dive In) */
        @keyframes zoomInSpace {
            0% { transform: scale(0.2) translateZ(-1000px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1) translateZ(0px); opacity: 1; }
        }

        @keyframes diveIntoFlower {
            0% { transform: translate(-50%, -50%) scale(0.1) rotateX(45deg) translateZ(-500px); }
            100% { transform: translate(-50%, -50%) scale(1) rotateX(0deg) translateZ(0px); }
        }

        /* صندوق الرسالة الفاخرة يظهر بعد الاكتمال */
        .love-message {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: showMessage 2s ease 5s forwards;
            z-index: 100;
            padding: 0 20px;
        }

        .love-message h1 {
            color: #ff85b3;
            font-size: 24px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(255, 133, 179, 0.6);
        }

        .love-message p {
            color: #fce4ec;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        @keyframes showMessage {
            to { opacity: 1; transform: translateY(0); }
        }

        /* قلوب متطايرة تدريجياً */
        .ambient-heart {
            position: absolute;
            color: #ff4d88;
            font-size: 14px;
            animation: floatUpSlow 5s infinite linear;
            z-index: 50;
        }

        @keyframes floatUpSlow {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="space" id="spaceLayer"></div>

    <!-- مشهد الوردة العميق -->
    <div class="flower-wrapper">
        <div class="rose-layer">
            <div class="3d-petal"></div>
            <div class="3d-petal"></div>
            <div class="3d-petal"></div>
            <div class="3d-petal"></div>
            <div class="3d-petal"></div>
            <div class="3d-petal"></div>
            <div class="3d-petal"></div>
            <div class="3d-petal"></div>
            <div class="rose-core"><span>❤️</span></div>
        </div>
    </div>

    <!-- الرسالة الرومانسية المميزة -->
    <div class="love-message">
        <h1>إلى من ملكت الروح والفؤاد ❤️</h1>
        <p>مثلما يدخل النور إلى أعمق زوايا القلب، أشرقتِ في حياتي فأزهرت عُمق روحي. كل عام وأنتِ النبض الذي لا يتوقف.</p>
    </div>

    <script>
        // خلق نجوم الفضاء العميقة
        const space = document.getElementById('spaceLayer');
        for (let i = 0; i < 50; i++) {
            let s = document.createElement('div');
            s.className = 'star';
            s.style.top = Math.random() * 100 + 'vh';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.width = (Math.random() * 3 + 1) + 'px';
            s.style.height = s.style.width;
            s.style.animationDelay = (Math.random() * 3) + 's';
            space.appendChild(s);
        }

        // خلق قلوب متطايرة تناسب الجو السينمائي
        setInterval(() => {
            let h = document.createElement('div');
            h.className = 'ambient-heart';
            h.innerHTML = '💖';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }, 800);
    </script>
</body>
</html>
